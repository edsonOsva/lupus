[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lupus-vision"
version = "0.1.0"
description = "Research tooling for a non-diagnostic facial-pattern prototype"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "Pillow>=12.0,<13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
lupus-data-audit = "lupus_vision.data.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
